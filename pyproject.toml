[project]
name = "lamina"
version = "0.2.0"
license = "AGPL-3.0-or-later"
description = "Lamina: turns 3D models into flat cut parts (stacked, interlocked, radial, ribbed, folded panels) for paper, cardboard and sheet metal"
requires-python = ">=3.11"
dependencies = [
    "trimesh>=4.4",
    "manifold3d",
    "shapely>=2.0",
    "numpy",
    "scipy",
    "scikit-image",
    "rtree",
    "ezdxf",
    "pillow",
    "reportlab",
    "rectpack",
    "fast-simplification",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "lxml>=6.1.3",
]

[project.optional-dependencies]
cad = ["cadquery"]          # STEP / IGES / BREP import:  uv sync --extra cad

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-timeout>=2.4.0",
    "ruff>=0.8",
]         # installed by a plain `uv sync`; run with `uv run pytest` and `uv run ruff check`

[tool.ruff]
line-length = 200
lint.select = ["F", "E9", "B", "S", "SIM", "UP"]   # pyflakes, syntax, bugbear, bandit, simplify, modern syntax
lint.ignore = ["S101", "S603", "S607", "S110",      # asserts and subprocess calls are deliberate; try/except/pass is documented where used
               "B008", "B905", "UP031"]             # FastAPI's File(None) default; zip() without strict; % formatting in the EPS writer

[tool.pytest.ini_options]
pythonpath = ["."]          # the tests import core/ from the repo root
testpaths = ["tests"]
timeout = 180               # a hang is a failure, not a wait: pytest-timeout stops the run and prints where it was

[tool.uv]
package = false
