[project]
name = "lamina3d"           # "lamina" on PyPI is somebody else's
version = "0.2.1"
readme = "README.md"
license = "AGPL-3.0-or-later"
description = "Lamina: turns 3D models into flat cut parts (stacked, interlocked, radial, ribbed, folded panels) for paper, cardboard and sheet metal"
requires-python = ">=3.11"
dependencies = [
    "trimesh>=4.4",
    "manifold3d",
    "shapely>=2.0",
    "numpy",
    "scipy",
    "scikit-image",
    "rtree",
    "ezdxf",
    "pillow",
    "reportlab",
    "rectpack",
    "fast-simplification",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "lxml>=6.1.3",
]

[project.scripts]
lamina3d = "web.app:main"   # uvx lamina3d — what the starters run

[project.urls]
Homepage = "https://marcelfarres.github.io/lamina/"
Source = "https://github.com/marcelfarres/lamina"

[project.optional-dependencies]
cad = ["cadquery"]          # STEP / IGES / BREP import:  uv sync --extra cad

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-timeout>=2.4.0",
    "ruff>=0.8",
]         # installed by a plain `uv sync`; run with `uv run pytest` and `uv run ruff check`

[tool.ruff]
line-length = 200
lint.select = ["F", "E9", "B", "S", "SIM", "UP"]   # pyflakes, syntax, bugbear, bandit, simplify, modern syntax
lint.ignore = ["S101", "S603", "S607", "S110",      # asserts and subprocess calls are deliberate; try/except/pass is documented where used
               "B008", "B905", "UP031"]             # FastAPI's File(None) default; zip() without strict; % formatting in the EPS writer

[tool.pytest.ini_options]
pythonpath = ["."]          # the tests import core/ from the repo root
testpaths = ["tests"]
timeout = 180               # a hang is a failure, not a wait: pytest-timeout stops the run and prints where it was

# The PyPI package (.github/workflows/pypi.yml publishes it on every release tag): web/ carries the examples and the
# changelog, so an installed copy finds them where web/app.py's bundled() looks.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ponytail: core/ and web/ install as top-level packages, fine in uvx's own environment; rename to lamina.* before
# anyone needs `pip install lamina3d` into a shared one
[tool.hatch.build.targets.wheel]
packages = ["core", "web"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "web/examples"
"CHANGELOG.md" = "web/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = ["core", "web", "examples", "CHANGELOG.md", "README.md", "LICENSE"]
