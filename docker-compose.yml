# Paste this into your stack manager, or save it as docker-compose.yml in a folder of its own and run
# `docker compose up -d` there (the README's "Keep your projects in a folder (Docker)" goes step by step).
# `docker compose pull` and then `docker compose up -d` update to the newest image; nothing here needs the source.
#
# Anyone who can open the page can read, change and delete the projects in the library folder: there is no login.
# Every device on your network (the same Wi-Fi) can open the page and change your projects. To allow only this
# computer, write `127.0.0.1:8000:8000` in place of `8000:8000` below.
services:
  lamina:
    image: ghcr.io/marcelfarres/lamina:latest
    container_name: lamina
    restart: unless-stopped
    mem_limit: 2g                        # a slice is bounded (see WEB_CONCURRENCY); this keeps one bad request from taking the host with it
    ports:
      - "8000:8000"                      # every device on your network; "127.0.0.1:8000:8000" for this computer only
    environment:
      LAMINA_TTL_HOURS: 0               # delete a tab's models and cut files this many hours after its last slice; 0 = never (only its "clear my data" button does)
      LAMINA_MAX_UPLOAD_MB: 0           # 0 = no cap, for your own machine. On a public address set a number (MB): bigger models are then refused (413)
      WEB_CONCURRENCY: 2                # slices that run at the same time (uvicorn workers): one per core you can spare, ~300 MB each
      LAMINA_LIBRARY: /library          # the library (your saved projects) is this folder, for every browser. Remove this line to keep the projects in each browser instead
      # LAMINA_HOSTS: lamina.example.com  # the library answers only on this computer's addresses and local names; add your own domain names here (comma-separated), if you open Lamina by one
    volumes:
      - lamina-jobs:/app/working-files   # sliced jobs and the session survive a restart
      - ./lamina-projects:/library       # the library on your computer: the folder lamina-projects next to this file, one .lamina.json file per revision

volumes:
  lamina-jobs:
