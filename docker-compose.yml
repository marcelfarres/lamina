# Paste this into your stack manager. `docker compose pull && docker compose up -d` updates to the newest image;
# nothing here needs the source, only the published image.
services:
  lamina:
    image: ghcr.io/marcelfarres/lamina:latest
    container_name: lamina
    restart: unless-stopped
    mem_limit: 2g                        # a slice is bounded (see WEB_CONCURRENCY); this keeps one bad request from taking the host with it
    ports:
      - "8000:8000"
    environment:
      LAMINA_TTL_HOURS: 0               # delete a tab's models and cut files this many hours after its last slice; 0 = never (only its "clear my data" button does)
      LAMINA_MAX_UPLOAD_MB: 30          # bigger models are refused (413); raise it on a private server
      WEB_CONCURRENCY: 2                # slices that run at the same time (uvicorn workers): one per core you can spare, ~300 MB each
    volumes:
      - lamina-jobs:/app/working-files   # sliced jobs and the session survive a restart

volumes:
  lamina-jobs:
