name: test

# The suite behind every change: pipeline, nesting, checks, exports, the web API, the browser build's code path and
# the parameter sweep. Runs on every push and pull request; the docker and pages workflows publish only from main.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run pytest tests -q -n auto     # every core (pytest-xdist): 32 min in one process, 4 on 12 cores

  # The app in a real browser: every parameter driving the slicer, the tables, undo, and nothing on screen cut off
  # (tests/test_ui.py, skipped by the job above because it needs Chromium)
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/test_ui.py -q
        env:
          LAMINA_UI: "1"

  # The published site, end to end: the static build loads its Python in a real browser and slices every technique
  # (tests/test_e2e_site.py). The pages workflow runs the same test before it deploys; here it runs on every pull
  # request, because the browser build's geometry engine differs from the desktop's and has failed where the
  # desktop never does — found at the deploy is found too late.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: python deploy/build_site.py
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/test_e2e_site.py -q
        env:
          LAMINA_E2E: "1"
