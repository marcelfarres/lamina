name: media

# The landing page's stills and clips, recorded from the app itself on every release, so they always show the
# version people download. A pre-commit hook would be the wrong place: a full recording takes well over half an hour.
# Run it by hand from the Actions tab too, with a few scene names to redo only those (e.g. "axes lobes").
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      scenes:
        description: "scene names, space separated (empty = every scene)"
        required: false
        default: ""

permissions:
  contents: write            # commits the refreshed docs/media back to the branch it recorded

concurrency:
  group: media
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    # 0.3.3's set took 18–31 min; 0.4.0's, with its lit clips drawn in software GL, ran past 60 (070). record.py
    # prints each scene's line with its minute, so a run that still ends here shows which scene it was on
    timeout-minutes: 150
    env:
      # a tag push records main, where the site deploys from; a run by hand records the branch it was started on — a
      # release branch before its tag, so a scene that ends on errors on Linux stops the release instead of following it
      BRANCH: ${{ github.event_name == 'push' && 'main' || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"   # capture.mjs uses the built-in WebSocket
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/media/record.py ${{ github.event.inputs.scenes }}
      - name: commit the media if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media
          if git diff --cached --quiet; then echo "media unchanged"; exit 0; fi
          git commit -m "Landing-page media recorded from ${GITHUB_REF_NAME}"
          git push origin "HEAD:$BRANCH"
