name: pypi

# Publishes lamina3d to PyPI on every release tag — what the starters install and update to (`uv tool install
# --upgrade lamina3d`), so a local copy only ever moves to a version that was tagged. The test suite is test.yml's
# job (it runs on the same tag, and on main before the tag); this one checks only what is new here: that the
# package, installed, works. Trusted publishing: no token, PyPI trusts this workflow (pypi.org → lamina3d →
# Publishing: repo marcelfarres/lamina, workflow pypi.yml, environment pypi).
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      actions: read        # the check below reads this repo's earlier runs
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # every commit, so earlier runs' commits can be compared with the tag
      # PyPI never takes a version twice, so nothing reaches it that GitHub's Linux runners have not passed: a green
      # test run and a green hand-run media recording (the release branch, before its tag) on this very code, the
      # recorded media aside. 0.2.2 went out tested on Windows only and shipped a Linux-only bug (fixed in 0.2.3)
      - name: this code passed the Linux tests and the media recording
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green() {
            for sha in $(gh run list --workflow "$1" --event "$2" --status success -L 100 --json headSha --jq '.[].headSha'); do
              git cat-file -e "$sha^{commit}" 2>/dev/null && git diff --quiet "$sha" HEAD -- . ':!docs/media' && return 0
            done
            echo "::error title=Not released::no green $1 run on this code — push the release branch and run /lamina-predeploy first"; return 1
          }
          green test.yml push && green media.yml workflow_dispatch
      - uses: astral-sh/setup-uv@v7
      - name: the tag is the version in pyproject.toml
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"" pyproject.toml
      # PyPI shows the README on its own page, where docs/media/… and examples/… resolve to nothing: pin them to this tag
      - name: the README's own links, absolute
        run: |
          sed -i -E "s#\]\((docs/media/[^)]+)\)#](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/\1)#g" README.md
          sed -i -E "s#\]\(([A-Za-z_.][^):]*)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/\1)#g" README.md
      - run: uv build
      # the wheel as the starters run it, from an empty folder: page, examples and changelog have to be inside it
      - name: the installed package slices
        run: |
          uv tool install dist/*.whl
          mkdir run && cd run
          BROWSER=true uv tool run lamina3d --port 8000 &
          trap "kill $!" EXIT   # left running, it holds uv's cache lock: setup-uv's cleanup then waits 5 min and fails the run
          for i in $(seq 60); do curl -sf localhost:8000/api/modes >/dev/null && break; sleep 1; done
          curl -sf localhost:8000/changelog.md | grep -q "^## ${GITHUB_REF_NAME#v}$"
          curl -sf localhost:8000/ | grep -q "<title>"
          curl -sf -F client=ci_smoke_0123456789 -F mode=stacked -F example=egg localhost:8000/api/slice | grep -q '"parts"'
          test -d working-files/jobs/ci_smoke_0123456789
      - run: uv publish
