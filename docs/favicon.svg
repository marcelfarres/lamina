<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
<!-- the app's mark: two panels crossing at right angles, the way interlocked slices meet. GitHub Pages serves
     docs/ as the site root and cannot reach web/static/, so this is a copy — keep it in step with
     web/static/logo.svg -->
<g stroke="#101a2e" stroke-width="1" stroke-linejoin="round">
<polygon points="6,7 16,12 16,24 6,19" fill="#3f7ae0"/>
<polygon points="26,7 16,12 16,24 26,19" fill="#2c5cb0"/>
<polygon points="16,12 6,17 6,29 16,24" fill="#3f7ae0"/>
<polygon points="16,12 26,17 26,29 16,24" fill="#7cadff"/>
<polygon points="26,7 6,17 6,14.5 26,4.5" fill="#7cadff"/>
<polygon points="6,7 26,17 26,14.5 6,4.5" fill="#bcd8ff"/>
</g>
</svg>
